<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRC Farms</title>
<style>
:root { --moss:#2B3A24; --sand:#EDE6D3; --beige:#DDD2B6; --deep:#222E1D; --panel:#35462D; }
* { box-sizing:border-box; margin:0; }
[hidden] { display:none !important; }
html { scroll-behavior:smooth; }
body { font-family:Georgia,"Times New Roman",serif; background:var(--moss); color:var(--sand); line-height:1.6; }
.bg { position:fixed; inset:0; z-index:-1; background:linear-gradient(160deg,#3d5232,#1c2817); }
.bg video { width:100%; height:100%; object-fit:cover; display:block; }
.bg::after { content:""; position:absolute; inset:0; background:var(--moss); opacity:.4; }
header { position:sticky; top:0; z-index:10; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px 16px; padding:12px 18px; background:rgba(43,58,36,.88); backdrop-filter:blur(6px); }
.brand { font-size:1.3rem; font-weight:bold; letter-spacing:.5px; }
nav { display:flex; gap:16px; font-size:.95rem; }
nav a { color:var(--sand); text-decoration:none; opacity:.85; }
nav a:hover { opacity:1; text-decoration:underline; }
.toggle { display:flex; align-items:center; gap:8px; font-size:.8rem; cursor:pointer; }
.toggle input { display:none; }
.switch { width:38px; height:20px; border-radius:20px; background:#6b7a63; position:relative; transition:.2s; }
.switch::after { content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--sand); transition:.2s; }
.toggle input:checked + .switch { background:#9bbf6a; }
.toggle input:checked + .switch::after { left:20px; }
.hero { min-height:75vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:40px 20px; }
.hero h1 { font-size:clamp(2.2rem,8vw,4.2rem); line-height:1.1; max-width:14em; }
.hero p { margin-top:16px; max-width:34em; font-size:1.1rem; opacity:.92; }
main { background:var(--deep); color:var(--sand); min-height:50vh; padding:40px 20px; border-radius:24px 24px 0 0; }
main section { max-width:900px; margin:0 auto 20px; padding:24px; border-radius:16px; background:var(--panel); color:var(--sand); }
main section:nth-of-type(even) { background:var(--beige); color:var(--moss); }
main h2 { font-size:1.6rem; margin-bottom:8px; }
.editing [data-key] { outline:1px dashed #9bbf6a; outline-offset:3px; }
.editing [data-key]:focus { outline:2px solid #9bbf6a; }

details { border-radius:12px; margin-top:10px; }
.month { background:rgba(255,255,255,.07); }
.month > summary { font-size:1.2rem; font-weight:bold; padding:14px 16px; }
.ms { background:rgba(0,0,0,.2); margin:8px 10px; }
.ms > summary { padding:10px 14px; }
summary { cursor:pointer; list-style-position:inside; }
.ms .body { padding:0 14px 14px; }
.date { opacity:.75; font-size:.85rem; margin-right:8px; }
.imgs { display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px; margin-top:10px; }
.imgs img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; }
.imgs .none { opacity:.6; font-size:.85rem; grid-column:1/-1; }
.empty { padding:0 16px 14px; opacity:.7; }
.adm { display:none; }
.editing .adm { display:block; }
.adm input, .adm textarea { width:100%; margin-top:8px; padding:8px; border-radius:8px; border:1px solid #9bbf6a; background:rgba(0,0,0,.25); color:inherit; font:inherit; }
.adm button { margin-top:8px; padding:8px 14px; border-radius:8px; border:1px solid #9bbf6a; background:none; color:inherit; font:inherit; cursor:pointer; }
.addrow { padding:0 10px 12px; }
.date:empty { display:none; }
#staff h3 { margin:18px 0 8px; font-size:1.1rem; }
.card { background:rgba(43,58,36,.09); margin-top:8px; }
.card > summary { display:flex; align-items:center; gap:12px; padding:12px; list-style:none; }
.card > summary::-webkit-details-marker { display:none; }
.card > summary::after { content:"\25BE"; margin-left:auto; }
.card[open] > summary::after { content:"\25B4"; }
.card .body { padding:0 12px 14px; }
.av { flex:none; width:44px; height:44px; border-radius:50%; background:var(--moss); color:var(--sand); display:inline-flex; align-items:center; justify-content:center; font-weight:bold; }
.av.sm { width:32px; height:32px; font-size:.8rem; }
.who { display:flex; flex-direction:column; }
.who small { opacity:.75; }
.bio { white-space:pre-line; }
.portrait { width:100%; max-width:420px; aspect-ratio:4/5; overflow:hidden; border-radius:16px; background:var(--moss); color:var(--sand); display:flex; align-items:center; justify-content:center; font-size:3rem; margin:4px auto 12px; }
.crew { list-style:none; padding:0; }
.crew li { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid rgba(43,58,36,.15); }
.crew .adm { width:100%; }
#team .adm input, #team .adm textarea { background:rgba(255,255,255,.55); }
.portrait img, .av img { width:100%; height:100%; object-fit:cover; display:block; }
.av { overflow:hidden; }
.ph { position:relative; }
.adm.x { position:absolute; top:4px; right:4px; margin:0; padding:2px 9px; }
.editing .adm.x { display:block; }
#auth .box { max-width:900px; margin:0 auto 20px; padding:16px; border-radius:16px; background:var(--panel); color:var(--sand); }
</style>
</head>
<body>
<div class="bg"></div>

<header>
  <div class="brand" data-key="brand">KRC Farms</div>
  <nav>
    <a href="#timeline" data-key="nav1">Timeline</a>
    <a href="#team" data-key="nav2">Team</a>
    <a href="#contact" data-key="nav3">Contact</a>
  </nav>
  <button id="export" hidden style="padding:4px 10px;border-radius:8px;border:1px solid #9bbf6a;background:none;color:inherit;font:inherit;font-size:.8rem">Export</button>
  <label class="toggle" id="adminToggle" hidden>
    <span>Edit Mode</span>
    <input type="checkbox" id="edit">
    <span class="switch"></span>
  </label>
</header>

<div class="hero">
  <h1 data-key="title">Growing something real, season by season</h1>
  <p data-key="intro">Follow the story of KRC Farms, from the first survey walk to the first harvest.</p>
</div>

<main id="content">
  <div id="auth" class="adm"><div class="box"><b>Admin login</b><span id="authState"></span>
    <input id="em" type="email" placeholder="Admin email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="signin">Sign in</button> <button id="signout">Sign out</button></div></div>
  <section id="timeline"><h2 data-key="h-timeline">Timeline</h2><div id="months"></div></section>
  <section id="team"><h2 data-key="h-team">Our Team</h2><div id="staff"></div></section>
  <section id="contact"><h2 data-key="h-contact">Contact</h2><p>Details to be added.</p></section>
</main>

<script>
// Paste a direct link to an .mp4 video between the quotes to enable the video background.
const VIDEO_URL = "";

const bg = document.querySelector(".bg");
if (VIDEO_URL) {
  const v = document.createElement("video");
  v.src = VIDEO_URL; v.autoplay = true; v.loop = true; v.muted = true; v.playsInline = true;
  bg.prepend(v);
}

const fields = document.querySelectorAll("[data-key]");
const isAdmin = location.hash === "#admin";
let content = {}, draft = {};
try { draft = JSON.parse(localStorage.getItem("krc-draft") || "{}"); } catch (e) {}
fetch("content.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : {}).catch(() => ({}))
  .then(d => {
    content = d;
    if (isAdmin) Object.assign(content, draft);
    fields.forEach(el => { if (content[el.dataset.key]) el.textContent = content[el.dataset.key]; });
    if (Array.isArray(content.milestones)) milestones = content.milestones;
    if (Array.isArray(content.execs)) execs = content.execs;
    if (Array.isArray(content.crew)) crew = content.crew;
    renderTimeline(); renderStaff();
  });
if (isAdmin) {
  document.getElementById("adminToggle").hidden = false;
  document.getElementById("export").hidden = false;
}
fields.forEach(el => el.addEventListener("input", () => {
  content[el.dataset.key] = el.textContent;
  try { localStorage.setItem("krc-draft", JSON.stringify(content)); } catch (e) {}
}));
document.getElementById("export").addEventListener("click", () => {
  content.milestones = milestones; content.execs = execs; content.crew = crew;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(content, null, 2)], { type: "application/json" }));
  a.download = "content.json";
  a.click();
});

let editing = false;
document.getElementById("edit").addEventListener("change", e => {
  editing = e.target.checked;
  document.body.classList.toggle("editing", editing);
  fields.forEach(el => el.contentEditable = editing);
});
document.querySelectorAll("nav a").forEach(a =>
  a.addEventListener("click", e => { if (editing) e.preventDefault(); })
);

// ---- Timeline data (Months -> Milestones -> Images). Strict order: February (1) to December (11). ----
const MONTHS = [
  {id:"feb",name:"February",order:1},{id:"mar",name:"March",order:2},{id:"apr",name:"April",order:3},
  {id:"may",name:"May",order:4},{id:"jun",name:"June",order:5},{id:"jul",name:"July",order:6},
  {id:"aug",name:"August",order:7},{id:"sep",name:"September",order:8},{id:"oct",name:"October",order:9},
  {id:"nov",name:"November",order:10},{id:"dec",name:"December",order:11}
];
const MILESTONES = [
  {month:"feb",date:"",title:"Property acquired",text:"Official property acquisition and initial topographical survey walk.",images:[]},
  {month:"mar",date:"",title:"Land clearing",text:"Land clearing and physical boundary demarcation.",images:[]},
  {month:"apr",date:"",title:"Irrigation delivery",text:"Delivery of irrigation pipes and water management equipment.",images:[]},
  {month:"may",date:"",title:"Land tillage",text:"Heavy land tillage and primary bed preparation.",images:[]},
  {month:"jun",date:"June 10",title:"Vehicle accident",text:"Minor vehicle accident involving the blue Hilux near Crossroads Mall during commute.",images:[]},
  {month:"jun",date:"June 10",title:"KRC meeting",text:"KRC meeting on crop selection, livestock locations, and manager roles.",images:[]},
  {month:"jun",date:"June 16",title:"New crew member",text:"John Shabwande joined the farm crew.",images:[]},
  {month:"jun",date:"June 21",title:"Planting begins",text:"Bed preparations finalized; planting initiated for summer crops (okra, green beans, carrots, and onions).",images:[]},
  {month:"jul",date:"",title:"Daily operations",text:"Daily farm operations focusing on routine watering, weeding, and growth monitoring.",images:[]},
  {month:"aug",date:"",title:"Borehole pipe extended",text:"Successful extension of the main borehole pipe to secure a reliable water supply.",images:[]},
  {month:"sep",date:"Sept 9",title:"Beds labeled",text:"Physical labeling of all growing beds completed.",images:[]},
  {month:"sep",date:"Sept 18",title:"103 chili beds",text:"Finished constructing and preparing 103 chili beds.",images:[]},
  {month:"sep",date:"Sept 21",title:"Spraying: beans and okra",text:"Green beans sprayed with Lara-max; okra sprayed with Cyper-max.",images:[]},
  {month:"sep",date:"Sept 24",title:"Spraying: onions",text:"Onions sprayed with Colam Super.",images:[]},
  {month:"sep",date:"Ongoing",title:"Lettuce harvest",text:"Lettuce harvest half done / half in progress; sold first self-produced sample of 20 healthy lettuce heads.",images:[]},
  {month:"oct",date:"",title:"Pending",text:"Entries to be added.",images:[]},
  {month:"nov",date:"",title:"Pending",text:"Entries to be added.",images:[]},
  {month:"dec",date:"",title:"Pending",text:"Entries to be added.",images:[]}
];
let milestones = MILESTONES;
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function saveDraft() {
  content.milestones = milestones; content.execs = execs; content.crew = crew;
  try { localStorage.setItem("krc-draft", JSON.stringify(content)); } catch (e) {}
}
function renderTimeline(openMonths, openMs) {
  openMonths = openMonths || ["sep"]; openMs = openMs || [];
  document.getElementById("months").innerHTML = MONTHS.slice().sort((a, b) => a.order - b.order).map(m => {
    const items = milestones.map((x, i) => ({x, i})).filter(o => o.x.month === m.id).map(({x, i}) => `
      <details class="ms"${openMs.includes(i) ? " open" : ""}><summary><span class="date">${esc(x.date)}</span><span class="t">${esc(x.title)}</span></summary>
        <div class="body"><p class="txt">${esc(x.text)}</p>
          <div class="imgs">${(x.images || []).length ? x.images.map((p, j) => `<span class="ph"><img src="${p}" loading="lazy" alt=""><button class="adm x" data-rm="${i}:${j}">&times;</button></span>`).join("") : '<span class="none">No photos yet</span>'}</div>
          <div class="adm">
            <input data-i="${i}" data-f="date" placeholder="Date (e.g. April 12)" value="${esc(x.date)}">
            <input data-i="${i}" data-f="title" placeholder="Title" value="${esc(x.title)}">
            <textarea data-i="${i}" data-f="text" rows="3" placeholder="What happened?">${esc(x.text)}</textarea>
            <label>Add photos<input type="file" accept="image/jpeg,image/png,image/webp" multiple data-up="${i}"></label>
            <button data-del="${i}">Delete event</button>
          </div></div></details>`).join("");
    return `<details class="month" data-m="${m.id}"${openMonths.includes(m.id) ? " open" : ""}><summary>${m.name}</summary>${items}<div class="adm addrow"><button data-add="${m.id}">+ Add event</button></div></details>`;
  }).join("");
}
const monthsBox = document.getElementById("months");
function openState() {
  return {
    m: [...monthsBox.querySelectorAll("details.month[open]")].map(d => d.dataset.m),
    s: [...monthsBox.querySelectorAll("details.ms[open]")].map(d => +d.querySelector("[data-i]").dataset.i)
  };
}
monthsBox.addEventListener("input", e => {
  const t = e.target, i = t.dataset.i;
  if (i === undefined) return;
  milestones[i][t.dataset.f] = t.value;
  const d = t.closest("details");
  d.querySelector(".date").textContent = milestones[i].date;
  d.querySelector(".t").textContent = milestones[i].title;
  d.querySelector(".txt").textContent = milestones[i].text;
  saveDraft();
});
monthsBox.addEventListener("click", e => {
  const add = e.target.dataset.add, del = e.target.dataset.del;
  if (add) {
    const st = openState();
    milestones.push({month: add, date: "", title: "New event", text: "", images: []});
    saveDraft();
    renderTimeline(st.m.concat(add), st.s.concat(milestones.length - 1));
  } else if (del !== undefined) {
    if (!confirm("Delete this event?")) return;
    const st = openState();
    milestones.splice(+del, 1);
    saveDraft();
    renderTimeline(st.m, []);
  }
});
renderTimeline();
// ---- Staff data: Tier 1 executives (accordion) and Tier 2 field crew (compact list) ----
const EXECS = [
  {name:"Dillon Nyimbili",role:"General Administration & Water",bio:"General Administrator - Responsible for overall coordination of farm trips - budget coordination, overseeing all farm departments.\n\nWater supply manager - Responsible for coordinating water usage and storage, irrigation system installation and maintenance and training of the whole team on appropriate usage and management of water facilities."},
  {name:"Davison Muzumara",role:"Operations",bio:"Operations manager - Responsible for weekly and daily planning of target activities. Monitoring progress and improving daily output; i.e. coordinating all daily farm activities."},
  {name:"Alichimfya Makangila",role:"Crop Administrator",bio:"Crop Administrator - Responsible for creating, reviewing and sharing of crop growth calendars, schedules and expectations, including monitoring of crop growth and guidance for the team on crop requirements at various growth stages."},
  {name:"Musonda Kaputo",role:"Equipment",bio:"Equipment manager - Responsible for monitoring and recording quantities and state of all equipment, ensuring good care and storage and coordinating purchasing, maintenance and replacement of all farm equipment."},
  {name:"Ruth Beremauro",role:"HR",bio:"Human Resource Manager - Responsible for coordinating all staff(KRC officers and farm employees), team building, role assigning, facilitating training and conflict resolution. Responsible for reinforcing KRC vision, team motivation and attending to individual human resource concerns."},
  {name:"Kasonde Makangila",role:"Senior Lead Supervisor",bio:"Biography to be added."},
  {name:"Your Name",role:"Lead Systems Architect & Digital Project Director",bio:"Biography to be added."}
];
const CREW = [
  {name:"Bento Chityamba",role:"The Transporter (Driver)"},
  {name:"Martin Kamfwa Shi Mutale",role:"The Caretaker"},
  {name:"Casius Mweemba",role:"Field Worker"},
  {name:"John Jongolosi",role:"Field Worker"},
  {name:"Roida Katongo",role:"Field Worker"},
  {name:"Nekson Mubita",role:"Field Worker"},
  {name:"Maybin Musanya",role:"Field Worker"},
  {name:"John Shabwande",role:"Field Worker"}
];
let execs = EXECS, crew = CREW;
const ini = n => n.split(/\s+/).filter(Boolean).map(w => w[0]).join("").slice(0, 2).toUpperCase() || "?";
const staffLists = () => ({execs, crew});
function renderStaff() {
  const form = (l, i, p, bio) => `<div class="adm">
    <input data-l="${l}" data-i="${i}" data-f="name" placeholder="Name" value="${esc(p.name)}">
    <input data-l="${l}" data-i="${i}" data-f="role" placeholder="Role" value="${esc(p.role)}">
    ${bio ? `<textarea data-l="${l}" data-i="${i}" data-f="bio" rows="4" placeholder="Biography">${esc(p.bio || "")}</textarea>` : ""}
    <label>${l === "execs" ? "Portrait (full-quality JPEG)" : "Photo"}<input type="file" accept="image/jpeg,image/png" data-pl="${l}" data-port="${i}"></label>
    <button data-dl="${l}" data-di="${i}">Remove</button></div>`;
  document.getElementById("staff").innerHTML = `
    <h3>Executive Management</h3>
    ${execs.map((p, i) => `<details class="card" name="exec"><summary><span class="av">${p.thumb ? `<img src="${p.thumb}" alt="">` : esc(ini(p.name))}</span><span class="who"><b class="n">${esc(p.name)}</b><small class="r">${esc(p.role)}</small></span></summary>
      <div class="body"><div class="portrait">${p.photo ? `<img src="${p.photo}" loading="lazy" alt="">` : esc(ini(p.name))}</div><p class="bio">${esc(p.bio || "")}</p>${form("execs", i, p, true)}</div></details>`).join("")}
    <div class="adm"><button data-addl="execs">+ Add executive</button></div>
    <h3>Field Operations &amp; Farm Crew</h3>
    <ul class="crew">${crew.map((p, i) => `<li><span class="av sm">${p.thumb ? `<img src="${p.thumb}" alt="">` : esc(ini(p.name))}</span><span class="who"><b class="n">${esc(p.name)}</b><small class="r">${esc(p.role)}</small></span>${form("crew", i, p, false)}</li>`).join("")}</ul>
    <div class="adm"><button data-addl="crew">+ Add crew member</button></div>`;
}
const staffBox = document.getElementById("staff");
staffBox.addEventListener("input", e => {
  const t = e.target, l = t.dataset.l;
  if (!l) return;
  const p = staffLists()[l][t.dataset.i];
  p[t.dataset.f] = t.value;
  const row = t.closest("details, li");
  row.querySelector(".n").textContent = p.name;
  row.querySelector(".r").textContent = p.role;
  if (!p.photo && !p.thumb) row.querySelectorAll(".av, .portrait").forEach(a => a.textContent = ini(p.name));
  const b = row.querySelector(".bio"); if (b) b.textContent = p.bio || "";
  saveDraft();
});
staffBox.addEventListener("click", e => {
  const add = e.target.dataset.addl, dl = e.target.dataset.dl;
  if (add) {
    staffLists()[add].push(add === "execs" ? {name:"New member",role:"",bio:""} : {name:"New member",role:""});
    saveDraft(); renderStaff();
    if (add === "execs") { const c = staffBox.querySelectorAll("details.card"); c[c.length - 1].open = true; }
  } else if (dl) {
    if (!confirm("Remove this person?")) return;
    staffLists()[dl].splice(+e.target.dataset.di, 1);
    saveDraft(); renderStaff();
  }
});
renderStaff();
// ---- Photos: Supabase storage (public viewing, admin-only uploads) ----
const SB = "https://niboqoycmrhrtdoldgdr.supabase.co";
const KEY = "sb_publishable_QdOfKiniiQqcevVaOv5dsw_yq_g8nI9";
let token = "";
try { token = sessionStorage.getItem("krc-token") || ""; } catch (e) {}
const showAuth = () => { document.getElementById("authState").textContent = token ? " - signed in" : " - not signed in"; };
async function login(email, pw) {
  const r = await fetch(SB + "/auth/v1/token?grant_type=password", {method:"POST", headers:{apikey:KEY, "Content-Type":"application/json"}, body:JSON.stringify({email, password:pw})});
  const d = await r.json();
  if (!r.ok) throw new Error(d.msg || d.error_description || "Login failed");
  token = d.access_token;
  try { sessionStorage.setItem("krc-token", token); } catch (e) {}
}
async function upload(path, blob, type) {
  const r = await fetch(SB + "/storage/v1/object/farm-photos/" + path, {method:"POST", headers:{apikey:KEY, Authorization:"Bearer " + token, "Content-Type":type, "x-upsert":"false"}, body:blob});
  if (!r.ok) {
    const d = await r.json().catch(() => ({}));
    throw new Error(r.status === 401 || r.status === 403 ? "Please sign in again (Admin login at the top)." : (d.message || "Upload failed (" + r.status + ")"));
  }
  return SB + "/storage/v1/object/public/farm-photos/" + path;
}
function toJpeg(file, max, q) {
  return new Promise((res, rej) => {
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(u);
      c.toBlob(b => b ? res(b) : rej(new Error("Could not process this image.")), "image/jpeg", q);
    };
    img.onerror = () => rej(new Error("Cannot read this image. HEIC files must be converted to JPEG first."));
    img.src = u;
  });
}
const rid = () => Date.now() + "-" + Math.random().toString(36).slice(2, 7);
document.getElementById("signin").onclick = async () => {
  try { await login(document.getElementById("em").value, document.getElementById("pw").value); document.getElementById("pw").value = ""; }
  catch (err) { alert(err.message); }
  showAuth();
};
document.getElementById("signout").onclick = () => { token = ""; try { sessionStorage.removeItem("krc-token"); } catch (e) {} showAuth(); };
showAuth();

monthsBox.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.up === undefined) return;
  const i = +t.dataset.up, files = [...t.files];
  if (!files.length) return;
  if (!token) { alert("Please sign in first (Admin login at the top)."); t.value = ""; return; }
  const st = openState();
  for (const f of files) {
    try {
      const b = await toJpeg(f, 1600, 0.82);
      const url = await upload("timeline/" + rid() + ".jpg", b, "image/jpeg");
      milestones[i].images = (milestones[i].images || []).concat(url);
    } catch (err) { alert(f.name + ": " + err.message); }
  }
  saveDraft();
  renderTimeline(st.m, st.s.concat(i));
});
monthsBox.addEventListener("click", e => {
  const rm = e.target.dataset.rm;
  if (rm === undefined) return;
  const [i, j] = rm.split(":").map(Number), st = openState();
  milestones[i].images.splice(j, 1);
  saveDraft();
  renderTimeline(st.m, st.s.concat(i));
});
staffBox.addEventListener("change", async e => {
  const t = e.target;
  if (t.dataset.port === undefined) return;
  const l = t.dataset.pl, i = +t.dataset.port, f = t.files[0];
  if (!f) return;
  if (!token) { alert("Please sign in first (Admin login at the top)."); t.value = ""; return; }
  if (/hei[cf]/i.test(f.type + f.name)) { alert("HEIC photos must be converted to JPEG first."); t.value = ""; return; }
  try {
    const thumb = await toJpeg(f, 256, 0.85), id = rid(), p = staffLists()[l][i];
    if (l === "execs") p.photo = await upload("portraits/" + id + (f.type === "image/png" ? ".png" : ".jpg"), f, f.type || "image/jpeg");
    p.thumb = await upload("portraits/" + id + "-thumb.jpg", thumb, "image/jpeg");
    saveDraft(); renderStaff();
    const row = staffBox.querySelectorAll(l === "execs" ? "details.card" : ".crew li")[i];
    if (row && l === "execs") row.open = true;
  } catch (err) { alert(err.message); }
});
</script>
